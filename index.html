<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Настройки автопостинга</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        background: #f5f6f9;
        color: #25262e;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
        margin: 0;
        padding: 40px 16px;
      }
      .card {
        background: #ffffff;
        padding: 28px;
        border-radius: 14px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        max-width: 520px;
        width: 100%;
      }
      h1 {
        margin: 0 0 24px 0;
        font-size: 20px;
        line-height: 1.3;
      }

      /* ── Текущие настройки ───────────────────────── */
      .current-settings {
        background: #f9fafb;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        margin-bottom: 24px;
        font-size: 13px;
      }
      .current-settings summary {
        cursor: pointer;
        list-style: none;
        padding: 12px 14px;
        font-weight: 500;
        color: #374151;
        user-select: none;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
      }
      .current-settings summary::-webkit-details-marker {
        display: none;
      }
      .current-settings summary::after {
        content: "▾";
        color: #9ca3af;
        font-size: 10px;
        transition: transform 0.15s;
      }
      .current-settings:not([open]) summary::after {
        transform: rotate(-90deg);
      }
      .info-rows {
        padding: 4px 14px 14px 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        border-top: 1px solid #eef0f3;
        margin-top: -1px;
        padding-top: 12px;
      }
      .info-row {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        line-height: 1.5;
      }
      .info-label {
        color: #6b7280;
        flex-shrink: 0;
        width: 110px;
        font-size: 12px;
        padding-top: 1px;
      }
      .info-value {
        color: #111827;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
        word-break: break-word;
        overflow-wrap: anywhere;
        flex: 1;
        min-width: 0;
      }
      .info-value.empty {
        color: #9ca3af;
        font-style: italic;
        font-family: inherit;
      }
      .info-text {
        white-space: pre-wrap;
        max-height: 4.5em;
        overflow: hidden;
        font-family: inherit;
      }

      /* ── Вкладки ─────────────────────────────────── */
      .tabs {
        display: flex;
        gap: 4px;
        border-bottom: 1px solid #e5e7eb;
        margin-bottom: 24px;
      }
      .tab {
        flex: 1;
        background: transparent;
        border: none;
        padding: 10px 4px;
        font-size: 14px;
        font-weight: 500;
        color: #6b7280;
        cursor: pointer;
        position: relative;
        border-radius: 0;
        font-family: inherit;
        transition: color 0.15s;
      }
      .tab:hover:not(:disabled) {
        background: transparent;
        color: #111827;
      }
      .tab.active {
        color: #007bff;
      }
      .tab.active::after {
        content: "";
        position: absolute;
        left: 8px;
        right: 8px;
        bottom: -1px;
        height: 2px;
        background: #007bff;
        border-radius: 2px;
      }

      /* ── Панели ─────────────────────────────────── */
      .panel {
        display: none;
      }
      .panel.active {
        display: block;
      }

      label {
        display: block;
        margin-bottom: 6px;
        font-weight: 500;
        font-size: 14px;
      }
      input,
      textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 15px;
        font-family: inherit;
        background: #fff;
      }
      textarea {
        font-size: 14px;
        line-height: 1.5;
        resize: vertical;
        min-height: 140px;
      }
      input[type="text"],
      input[type="password"] {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 13px;
      }
      input:focus,
      textarea:focus {
        outline: none;
        border-color: #007bff;
        box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.15);
      }
      .field {
        margin-bottom: 20px;
      }
      .field:last-of-type {
        margin-bottom: 16px;
      }

      button {
        width: 100%;
        padding: 11px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.15s;
        font-family: inherit;
      }
      button:hover:not(:disabled) {
        background: #0056b3;
      }
      button:disabled {
        background: #ccc;
        cursor: not-allowed;
      }

      .meta {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-top: 6px;
        margin-bottom: 16px;
        font-size: 12px;
        color: #9ca3af;
      }
      .char-counter {
        font-variant-numeric: tabular-nums;
      }
      .char-counter.over {
        color: #991b1b;
        font-weight: 600;
      }

      /* ── Статус-бар ──────────────────────────────── */
      #status {
        margin-top: 20px;
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 13px;
        text-align: center;
        display: none;
      }
      .success {
        background: #d1fae5;
        color: #065f46;
      }
      .error {
        background: #fee2e2;
        color: #991b1b;
      }
      .info {
        background: #eff6ff;
        color: #1e40af;
      }

      /* ── Авторизация ─────────────────────────────── */
      .auth-section {
        padding-bottom: 8px;
      }
      .main-section {
        display: none;
      }
      .auth-hint {
        font-size: 12px;
        color: #9ca3af;
        margin-top: 8px;
        line-height: 1.4;
        text-align: center;
      }
      .auth-hint.error {
        color: #991b1b;
      }

      .logout-btn {
        background: transparent;
        color: #6b7280;
        font-size: 13px;
        padding: 8px;
        width: 100%;
        margin-top: 8px;
        font-weight: 400;
      }
      .logout-btn:hover:not(:disabled) {
        background: #f3f4f6;
        color: #374151;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1 id="cardTitle">Настройки автопостинга</h1>

      <!-- Блок авторизации -->
      <div class="auth-section" id="authSection">
        <div class="field">
          <label for="authToken">Пароль</label>
          <input
            type="password"
            id="authToken"
            placeholder="Введите пароль"
            autocomplete="off"
          />
        </div>
        <button id="authBtn">Войти</button>
        <div id="authStatus" class="auth-hint"></div>
      </div>

      <!-- Основной блок -->
      <div class="main-section" id="mainSection">
        <!-- Текущие (сохранённые) настройки -->
        <details class="current-settings" open>
          <summary>Текущие настройки</summary>
          <div class="info-rows">
            <div class="info-row">
              <span class="info-label">Время</span>
              <span class="info-value empty" id="infoTime">—</span>
            </div>
            <div class="info-row">
              <span class="info-label">Диапазон</span>
              <span class="info-value empty" id="infoPhotos" title="">—</span>
            </div>
            <div class="info-row">
              <span class="info-label">Текст</span>
              <span class="info-value info-text empty" id="infoText">—</span>
            </div>
          </div>
        </details>

        <!-- Вкладки -->
        <div class="tabs" role="tablist">
          <button class="tab active" data-tab="time" role="tab">Время</button>
          <button class="tab" data-tab="text" role="tab">Текст</button>
          <button class="tab" data-tab="photos" role="tab">Фото</button>
        </div>

        <!-- Панель: Время -->
        <div class="panel active" id="panel-time">
          <div class="field">
            <label for="publishTime">Время публикации (МСК)</label>
            <input type="time" id="publishTime" required />
          </div>
          <button id="submitTimeBtn">Сохранить время</button>
        </div>

        <!-- Панель: Текст -->
        <div class="panel" id="panel-text">
          <div class="field">
            <label for="postText">Текст поста</label>
            <textarea
              id="postText"
              placeholder="Введите текст, который будет опубликован вместе с фото"
              spellcheck="true"
            ></textarea>
            <div class="meta">
              <span>Ctrl/Cmd + Enter — сохранить</span>
              <span class="char-counter" id="charCounter">0 / 4000</span>
            </div>
          </div>
          <button id="submitTextBtn">Сохранить текст</button>
        </div>

        <!-- Панель: Фото -->
        <div class="panel" id="panel-photos">
          <div class="field">
            <label for="photoFirstId">ID первого фото</label>
            <input
              type="text"
              id="photoFirstId"
              placeholder="photo-239232916_456239539"
              autocomplete="off"
              spellcheck="false"
            />
          </div>
          <div class="field">
            <label for="photoLastId">ID последнего фото</label>
            <input
              type="text"
              id="photoLastId"
              placeholder="photo-239232916_456239620"
              autocomplete="off"
              spellcheck="false"
            />
          </div>
          <button id="submitPhotosBtn">Сохранить диапазон</button>
        </div>

        <button id="logoutBtn" class="logout-btn">Выйти</button>
      </div>

      <div id="status"></div>
    </div>

    <script>
      // ── НАСТРОЙКИ ──────────────────────────────────────
      const API_BASE = "https://autopostingvkas.bothost.tech/api/schedule";

      const REQUEST_TIMEOUT_MS = 15000;
      const STATUS_AUTOHIDE_MS = 3000;
      const PHOTO_ID_RE = /^photo-?\d+_\d+$/;
      let POST_TEXT_MAX = 4000;

      // ── DOM ───────────────────────────────────────────
      const cardTitle = document.getElementById("cardTitle");
      const authSection = document.getElementById("authSection");
      const mainSection = document.getElementById("mainSection");
      const authInput = document.getElementById("authToken");
      const authBtn = document.getElementById("authBtn");
      const authStatus = document.getElementById("authStatus");

      const infoTime = document.getElementById("infoTime");
      const infoPhotos = document.getElementById("infoPhotos");
      const infoText = document.getElementById("infoText");

      const tabs = document.querySelectorAll(".tab");
      const panels = {
        time: document.getElementById("panel-time"),
        text: document.getElementById("panel-text"),
        photos: document.getElementById("panel-photos"),
      };

      const timeInput = document.getElementById("publishTime");
      const submitTimeBtn = document.getElementById("submitTimeBtn");

      const postTextArea = document.getElementById("postText");
      const charCounter = document.getElementById("charCounter");
      const submitTextBtn = document.getElementById("submitTextBtn");

      const firstIdInput = document.getElementById("photoFirstId");
      const lastIdInput = document.getElementById("photoLastId");
      const submitPhotosBtn = document.getElementById("submitPhotosBtn");

      const logoutBtn = document.getElementById("logoutBtn");
      const statusEl = document.getElementById("status");

      // ── Состояние "на сервере" ────────────────────────
      // Отдельно от формы: показывает, что реально сохранено.
      const currentState = {
        publish_time: "",
        photo_first_id: "",
        photo_last_id: "",
        photos_count: 0,
        post_text: "",
      };

      // ── Хранение пароля ───────────────────────────────
      let savedToken = localStorage.getItem("auth_token") || "";

      if (savedToken) {
        tryAuth(savedToken);
      }

      // ── Переключение вкладок ──────────────────────────
      tabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          const name = tab.dataset.tab;
          tabs.forEach((t) => t.classList.toggle("active", t === tab));
          Object.entries(panels).forEach(([key, el]) => {
            el.classList.toggle("active", key === name);
          });
          statusEl.style.display = "none";
        });
      });

      // ── fetch с таймаутом ─────────────────────────────
      async function fetchWithTimeout(url, options = {}, timeoutMs = REQUEST_TIMEOUT_MS) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        try {
          return await fetch(url, { ...options, signal: controller.signal });
        } finally {
          clearTimeout(timer);
        }
      }

      // ── Авторизация ───────────────────────────────────
      authBtn.addEventListener("click", () => {
        const token = authInput.value.trim();
        if (!token) {
          setAuthHint("Введите пароль", true);
          return;
        }
        tryAuth(token);
      });

      authInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") authBtn.click();
      });

      function setAuthHint(text, isError = false) {
        authStatus.textContent = text;
        authStatus.classList.toggle("error", isError);
      }

      async function tryAuth(token) {
        authBtn.disabled = true;
        setAuthHint("Проверка...");

        try {
          const res = await fetchWithTimeout(API_BASE, {
            headers: { "X-Auth-Token": token },
          });

          if (res.status === 401) {
            setAuthHint("Неверный пароль", true);
            localStorage.removeItem("auth_token");
            savedToken = "";
            return;
          }

          if (!res.ok) {
            setAuthHint("Ошибка сервера: " + res.status, true);
            return;
          }

          const data = await res.json();
          savedToken = token;
          localStorage.setItem("auth_token", token);
          setAuthHint("");

          authSection.style.display = "none";
          cardTitle.style.display = "none";
          mainSection.style.display = "block";

          applyConfig(data);
        } catch (e) {
          if (e.name === "AbortError") {
            setAuthHint("Сервер не отвечает", true);
          } else {
            setAuthHint("Ошибка сети или CORS", true);
          }
          console.error(e);
        } finally {
          authBtn.disabled = false;
        }
      }

      // ── Применение конфига ────────────────────────────
      function applyConfig(data) {
        // 1. Заполняем форму
        if (data.publish_time) {
          timeInput.value = data.publish_time;
        }
        if (typeof data.post_text === "string") {
          postTextArea.value = data.post_text;
        }
        if (typeof data.post_text_max === "number") {
          POST_TEXT_MAX = data.post_text_max;
        }
        if (data.photo_first_id) {
          firstIdInput.value = data.photo_first_id;
        }
        if (data.photo_last_id) {
          lastIdInput.value = data.photo_last_id;
        }
        updateCharCounter();

        // 2. Обновляем "текущие настройки" (что на сервере)
        if (typeof data.publish_time === "string") {
          currentState.publish_time = data.publish_time;
        }
        if (typeof data.photo_first_id === "string") {
          currentState.photo_first_id = data.photo_first_id;
        }
        if (typeof data.photo_last_id === "string") {
          currentState.photo_last_id = data.photo_last_id;
        }
        if (typeof data.photos_count === "number") {
          currentState.photos_count = data.photos_count;
        }
        if (typeof data.post_text === "string") {
          currentState.post_text = data.post_text;
        }
        renderCurrentState();
      }

      // ── Отрисовка "текущих настроек" ──────────────────
      function renderCurrentState() {
        // Время
        if (currentState.publish_time) {
          infoTime.textContent = `${currentState.publish_time} МСК`;
          infoTime.classList.remove("empty");
        } else {
          infoTime.textContent = "—";
          infoTime.classList.add("empty");
        }

        // Диапазон фото
        if (currentState.photo_first_id && currentState.photo_last_id) {
          const f = shortPhotoId(currentState.photo_first_id);
          const l = shortPhotoId(currentState.photo_last_id);
          infoPhotos.textContent = `${currentState.photos_count} фото · ${f} → ${l}`;
          infoPhotos.title = `${currentState.photo_first_id} → ${currentState.photo_last_id}`;
          infoPhotos.classList.remove("empty");
        } else {
          infoPhotos.textContent = "—";
          infoPhotos.title = "";
          infoPhotos.classList.add("empty");
        }

        // Текст
        const text = (currentState.post_text || "").trim();
        if (text) {
          infoText.textContent = text;
          infoText.classList.remove("empty");
        } else {
          infoText.textContent = "—";
          infoText.classList.add("empty");
        }
      }

      // "photo-239232916_456239539" → "456239539"
      function shortPhotoId(id) {
        const m = id.match(/^photo-?\d+_(\d+)$/);
        return m ? m[1] : id;
      }

      // ── Счётчик ───────────────────────────────────────
      function updateCharCounter() {
        const len = postTextArea.value.length;
        charCounter.textContent = `${len} / ${POST_TEXT_MAX}`;
        charCounter.classList.toggle("over", len > POST_TEXT_MAX);
      }

      postTextArea.addEventListener("input", updateCharCounter);

      // ── Авторизованный fetch ──────────────────────────
      async function authFetch(url, options = {}) {
        const res = await fetchWithTimeout(url, {
          ...options,
          headers: {
            "X-Auth-Token": savedToken,
            ...(options.headers || {}),
          },
        });

        if (res.status === 401) {
          handleAuthExpired();
          throw new Error("AUTH_EXPIRED");
        }

        return res;
      }

      function handleAuthExpired() {
        localStorage.removeItem("auth_token");
        savedToken = "";
        mainSection.style.display = "none";
        cardTitle.style.display = "block";
        authSection.style.display = "block";
        setAuthHint("Пароль устарел, войдите заново", true);
        statusEl.style.display = "none";
      }

      // ── Общий обработчик ошибок ───────────────────────
      function handleRequestError(e) {
        if (e.message === "AUTH_EXPIRED") return;
        const msg =
          e.name === "AbortError" ? "Сервер не отвечает" : "Ошибка сети или CORS";
        showStatus(msg, "error", 0);
        console.error(e);
      }

      // ── Сохранение времени ────────────────────────────
      submitTimeBtn.addEventListener("click", async () => {
        const timeValue = timeInput.value;
        if (!timeValue) {
          showStatus("Укажите время", "error", 0);
          return;
        }

        submitTimeBtn.disabled = true;
        showStatus("Отправка...", "info", 0);

        try {
          const res = await authFetch(`${API_BASE}/publish_time`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ time: timeValue }),
          });

          const data = await res.json().catch(() => ({}));

          if (res.ok) {
            showStatus("Время сохранено", "success");
            applyConfig(data);
          } else {
            showStatus(data.error || "Ошибка сервера", "error", 0);
          }
        } catch (e) {
          handleRequestError(e);
        } finally {
          submitTimeBtn.disabled = false;
        }
      });

      // ── Сохранение текста ─────────────────────────────
      submitTextBtn.addEventListener("click", async () => {
        const text = postTextArea.value;

        if (text.length > POST_TEXT_MAX) {
          showStatus(
            `Слишком длинный текст: ${text.length} из ${POST_TEXT_MAX}`,
            "error",
            0
          );
          return;
        }

        submitTextBtn.disabled = true;
        showStatus("Отправка...", "info", 0);

        try {
          const res = await authFetch(`${API_BASE}/post_text`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text }),
          });

          const data = await res.json().catch(() => ({}));

          if (res.ok) {
            showStatus("Текст сохранён", "success");
            applyConfig(data);
          } else {
            showStatus(data.error || "Ошибка сервера", "error", 0);
          }
        } catch (e) {
          handleRequestError(e);
        } finally {
          submitTextBtn.disabled = false;
        }
      });

      postTextArea.addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
          e.preventDefault();
          submitTextBtn.click();
        }
      });

      // ── Сохранение диапазона фото ─────────────────────
      submitPhotosBtn.addEventListener("click", async () => {
        const firstId = firstIdInput.value.trim();
        const lastId = lastIdInput.value.trim();

        if (!firstId || !lastId) {
          showStatus("Укажите оба ID", "error", 0);
          return;
        }

        if (!PHOTO_ID_RE.test(firstId) || !PHOTO_ID_RE.test(lastId)) {
          showStatus("Формат: photo<owner>_<id>", "error", 0);
          return;
        }

        submitPhotosBtn.disabled = true;
        showStatus("Отправка...", "info", 0);

        try {
          const res = await authFetch(`${API_BASE}/photos`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ first_id: firstId, last_id: lastId }),
          });

          const data = await res.json().catch(() => ({}));

          if (res.ok) {
            showStatus(`Диапазон сохранён — ${data.photos_count} фото`, "success");
            applyConfig(data);
          } else {
            showStatus(data.error || "Ошибка сервера", "error", 0);
          }
        } catch (e) {
          handleRequestError(e);
        } finally {
          submitPhotosBtn.disabled = false;
        }
      });

      // ── Выход ─────────────────────────────────────────
      logoutBtn.addEventListener("click", () => {
        localStorage.removeItem("auth_token");
        savedToken = "";
        authInput.value = "";
        setAuthHint("");
        mainSection.style.display = "none";
        cardTitle.style.display = "block";
        authSection.style.display = "block";
        statusEl.style.display = "none";

        // Сброс формы
        timeInput.value = "";
        postTextArea.value = "";
        firstIdInput.value = "";
        lastIdInput.value = "";
        updateCharCounter();

        // Сброс "текущих настроек"
        Object.assign(currentState, {
          publish_time: "",
          photo_first_id: "",
          photo_last_id: "",
          photos_count: 0,
          post_text: "",
        });
        renderCurrentState();

        // Вкладка «Время» по умолчанию
        tabs.forEach((t) => t.classList.toggle("active", t.dataset.tab === "time"));
        Object.entries(panels).forEach(([key, el]) =>
          el.classList.toggle("active", key === "time")
        );
      });

      // ── Статус ────────────────────────────────────────
      let statusTimer = null;

      function showStatus(text, type, autoHideMs) {
        statusEl.textContent = text;
        statusEl.style.display = "block";
        statusEl.classList.remove("success", "error", "info");
        statusEl.classList.add(type);

        clearTimeout(statusTimer);
        statusTimer = null;

        if (autoHideMs === undefined) {
          autoHideMs = type === "success" ? STATUS_AUTOHIDE_MS : 0;
        }
        if (autoHideMs > 0) {
          statusTimer = setTimeout(() => {
            statusEl.style.display = "none";
          }, autoHideMs);
        }
      }
    </script>
  </body>
</html>
