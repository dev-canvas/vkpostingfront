<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Настройка времени публикации</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        background: #f5f6f9;
        color: #25262e;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }
      .card {
        background: #ffffff;
        padding: 28px;
        border-radius: 14px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        max-width: 420px;
        width: 100%;
      }
      h1 {
        margin: 0 0 20px 0;
        font-size: 20px;
        line-height: 1.3;
      }
      label {
        display: block;
        margin-bottom: 6px;
        font-weight: 500;
        font-size: 14px;
      }
      input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 15px;
        margin-bottom: 16px;
      }
      input:focus {
        outline: none;
        border-color: #007bff;
        box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.15);
      }
      button {
        width: 100%;
        padding: 12px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        cursor: pointer;
        transition: background 0.15s;
      }
      button:hover {
        background: #0056b3;
      }
      button:disabled {
        background: #ccc;
        cursor: not-allowed;
      }
      #status {
        margin-top: 16px;
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 13px;
        text-align: center;
        display: none;
      }
      .success {
        background: #d1fae5;
        color: #065f46;
      }
      .error {
        background: #fee2e2;
        color: #991b1b;
      }
      .auth-section {
        border-bottom: 1px solid #e5e7eb;
        padding-bottom: 20px;
        margin-bottom: 20px;
      }
      .main-section {
        display: none;
      }
      .hint {
        font-size: 12px;
        color: #9ca3af;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Настройка времени публикации</h1>

      <!-- Блок авторизации -->
      <div class="auth-section" id="authSection">
        <label for="authToken">Пароль</label>
        <input
          type="password"
          id="authToken"
          placeholder="Введите пароль"
          autocomplete="off"
        />
        <button id="authBtn">Войти</button>
        <div id="authStatus" class="hint"></div>
      </div>

      <!-- Основной блок (показывается после авторизации) -->
      <div class="main-section" id="mainSection">
        <label for="publishTime">Время публикации (МСК)</label>
        <input type="time" id="publishTime" required />
        <button id="submitBtn">Установить время</button>
        <div id="status"></div>
      </div>
    </div>

    <script>
      // ── НАСТРОЙКИ ──────────────────────────────────────
      const API_URL = "https://autopostingvkas.bothost.tech/api/schedule/publish_time";
      // Замените на адрес вашего бэкенда на Bothost

      // ── Элементы DOM ──────────────────────────────────
      const authSection = document.getElementById("authSection");
      const mainSection = document.getElementById("mainSection");
      const authInput = document.getElementById("authToken");
      const authBtn = document.getElementById("authBtn");
      const authStatus = document.getElementById("authStatus");
      const timeInput = document.getElementById("publishTime");
      const submitBtn = document.getElementById("submitBtn");
      const statusEl = document.getElementById("status");

      // ── Хранение пароля в localStorage ────────────────
      let savedToken = localStorage.getItem("auth_token") || "";

      // Если пароль уже сохранён — пробуем авторизоваться автоматически
      if (savedToken) {
        tryAuth(savedToken);
      }

      // ── Кнопка "Войти" ─────────────────────────────────
      authBtn.addEventListener("click", () => {
        const token = authInput.value.trim();
        if (!token) {
          authStatus.textContent = "Введите пароль";
          authStatus.style.color = "#991b1b";
          return;
        }
        tryAuth(token);
      });

      // Enter в поле пароля
      authInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") authBtn.click();
      });

      // ── Попытка авторизации ───────────────────────────
      async function tryAuth(token) {
        authBtn.disabled = true;
        authStatus.textContent = "Проверка...";
        authStatus.style.color = "#6b7280";

        try {
          const res = await fetch(API_URL, {
            headers: { "X-Auth-Token": token },
          });

          if (res.status === 401) {
            authStatus.textContent = "Неверный пароль";
            authStatus.style.color = "#991b1b";
            localStorage.removeItem("auth_token");
            savedToken = "";
            authInput.value = "";
            return;
          }

          if (!res.ok) {
            authStatus.textContent = "Ошибка сервера: " + res.status;
            authStatus.style.color = "#991b1b";
            return;
          }

          // Успех — сохраняем пароль, показываем основной блок
          const data = await res.json();
          savedToken = token;
          localStorage.setItem("auth_token", token);

          authSection.style.display = "none";
          mainSection.style.display = "block";

          if (data.publish_time) {
            timeInput.value = data.publish_time;
          }
        } catch (e) {
          authStatus.textContent = "Ошибка сети или CORS";
          authStatus.style.color = "#991b1b";
          console.error(e);
        } finally {
          authBtn.disabled = false;
        }
      }

      // ── Кнопка "Установить время" ─────────────────────
      submitBtn.addEventListener("click", async () => {
        const timeValue = timeInput.value;
        if (!timeValue) {
          showStatus("Укажите время", "error");
          return;
        }

        submitBtn.disabled = true;
        showStatus("Отправка...", "success");

        try {
          const res = await fetch(API_URL, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-Auth-Token": savedToken,
            },
            body: JSON.stringify({ time: timeValue }),
          });

          const data = await res.json().catch(() => ({}));

          if (res.status === 401) {
            // Пароль больше не подходит — возвращаем к авторизации
            localStorage.removeItem("auth_token");
            savedToken = "";
            mainSection.style.display = "none";
            authSection.style.display = "block";
            authStatus.textContent = "Пароль устарел, введите заново";
            authStatus.style.color = "#991b1b";
            return;
          }

          if (res.ok) {
            showStatus("Время успешно установлено!", "success");
          } else {
            const msg = data.error || data.detail || "Ошибка сервера";
            showStatus(msg, "error");
          }
        } catch (e) {
          showStatus("Ошибка сети или CORS", "error");
          console.error(e);
        } finally {
          submitBtn.disabled = false;
        }
      });

      // Enter в поле времени
      timeInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") submitBtn.click();
      });

      // ── Показ статуса ─────────────────────────────────
      function showStatus(text, type) {
        statusEl.textContent = text;
        statusEl.style.display = "block";
        statusEl.classList.remove("success", "error");
        statusEl.classList.add(type);
      }
    </script>
  </body>
</html>
